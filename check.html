<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Status Check</title>
  <style>
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 20px 12px; }
    .container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1e3a8a; margin-top: 0; font-size: 22px; }
    .helpline-bar { background: #e0f2fe; color: #0284c7; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
    .helpline-bar a { color: #0284c7; text-decoration: none; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #msg { text-align: center; font-weight: bold; margin: 12px 0; font-size: 14px; }
    .card { display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-top: 15px; }
    .row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed #cbd5e1; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .row span:first-child { color: #64748b; font-weight: 500; }
    .row span:last-child { font-weight: bold; color: #0f172a; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; color: white; display: inline-block; }
    .badge-paid { background: #16a34a; }
    .badge-pending { background: #ea580c; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Ticket Status Portal</h2>
    <div class="helpline-bar">
      Helpline: <a href="tel:7808410288">+91 7808410288</a>
    </div>

    <!-- Ticket Search Input -->
    <div class="input-group">
      <input type="text" id="tktInput" placeholder="Apna Ticket No. daalein..." autocomplete="off">
      <button type="button" id="searchBtn" onclick="searchTicket()">Check</button>
    </div>

    <div id="msg"></div>

    <!-- Details Result Card -->
    <div class="card" id="resultCard">
      <div class="row">
        <span>Ticket Number:</span>
        <span id="resTicket">-</span>
      </div>
      <div class="row">
        <span>Naam:</span>
        <span id="resName">-</span>
      </div>
      <div class="row">
        <span>Mobile:</span>
        <span id="resMobile">-</span>
      </div>
      <div class="row">
        <span>Prize:</span>
        <span id="resPrize">-</span>
      </div>
      <div class="row">
        <span>Prize Amount:</span>
        <span id="resAmount" style="color: #16a34a;">-</span>
      </div>
      <div class="row">
        <span>Fee / Charge:</span>
        <span id="resFee">-</span>
      </div>
      <div class="row">
        <span>UPI ID:</span>
        <span id="resUpi">-</span>
      </div>
      <div class="row">
        <span>Status:</span>
        <span id="resStatus">-</span>
      </div>
    </div>
  </div>

  <script>
    const API = "https://sheetdb.io/api/v1/0n74j9e4e70p7";

    const tktInput = document.getElementById("tktInput");
    const searchBtn = document.getElementById("searchBtn");
    const msg = document.getElementById("msg");
    const resultCard = document.getElementById("resultCard");

    // Enter press support
    tktInput.addEventListener("keyup", function(e) {
      if (e.key === "Enter") searchTicket();
    });

    async function searchTicket() {
      const ticketVal = tktInput.value.trim();

      if (!ticketVal) {
        msg.style.color = "#ef4444";
        msg.innerText = "Kripya valid Ticket number daalein!";
        resultCard.style.display = "none";
        return;
      }

      msg.style.color = "#2563eb";
      msg.innerText = "Details check ho rahi hain...";
      searchBtn.disabled = true;
      resultCard.style.display = "none";

      try {
        // SheetDB search endpoint by ticket
        const res = await fetch(`${API}/search?ticket=${encodeURIComponent(ticketVal)}`);
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          const item = data[0];
          
          document.getElementById("resTicket").innerText = item.ticket || "-";
          document.getElementById("resName").innerText = item.name || "-";
          document.getElementById("resMobile").innerText = item.mobile || "-";
          document.getElementById("resPrize").innerText = item.prize || "-";
          document.getElementById("resAmount").innerText = item.amount ? `₹${item.amount}` : "-";
          document.getElementById("resFee").innerText = item.fee ? `₹${item.fee}` : "-";
          document.getElementById("resUpi").innerText = item.upiId || "-";

          // Status Badge
          const statusVal = (item.status || "Pending").trim();
          const badgeClass = statusVal.toLowerCase() === "paid" ? "badge-paid" : "badge-pending";
          document.getElementById("resStatus").innerHTML = `<span class="badge ${badgeClass}">${statusVal}</span>`;

          msg.innerText = "";
          resultCard.style.display = "block";
        } else {
          msg.style.color = "#ef4444";
          msg.innerText = "Is ticket number ka koi record nahi mila!";
        }
      } catch (err) {
        msg.style.color = "#ef4444";
        msg.innerText = "Server error! Dobara koshish karein.";
      } finally {
        searchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
